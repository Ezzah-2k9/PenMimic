[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PenMimic"
version = "0.1.1"
description = "Write any text in your own handwriting, from photos of a filled-in template sheet."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ezzah Najmal" }]
keywords = ["handwriting", "cursive", "opencv", "pillow", "image", "text-to-handwriting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.1",
]

[project.optional-dependencies]
demo = ["flask>=3.0"]
dev = ["pytest>=8.0", "flask>=3.0", "build", "twine"]

[project.scripts]
penmimic = "penmimic.cli:main"

[project.urls]
Homepage = "https://github.com/Ezzah-2k9/penmimic"
Issues = "https://github.com/Ezzah-2k9/penmimic/issues"
Documentation = "https://github.com/Ezzah-2k9/penmimic#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
penmimic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]